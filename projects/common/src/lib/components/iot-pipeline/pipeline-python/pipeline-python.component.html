<div class="python-config" [formGroup]="pythonForm">
    <mat-card-header>
        <mat-card-title>Python Configuration</mat-card-title>
    </mat-card-header>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Processor</mat-label>
            <mat-select #processor formControlName="processor" (selectionChange)="updateContent($event.value, 'processors')">
                <mat-option *ngFor="let item of resources.processors; let i = index" [value]="item.name">
                    {{item.name}}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <button mat-icon-button (click)="showResourceContent(processor.value, 'processors')" matTooltip="Preview Processor">
            <mat-icon>remove_red_eye</mat-icon>
        </button>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Requirement</mat-label>
            <mat-select #requirement formControlName="requirement" (selectionChange)="updateContent($event.value, 'requirements')">
                <mat-option *ngFor="let item of resources.requirements; let i = index" [value]="item.name">
                    {{item.name}}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <button mat-icon-button (click)="showResourceContent(requirement.value, 'requirements')" matTooltip="Preview Requirement">
            <mat-icon>remove_red_eye</mat-icon>
        </button>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Dockerfile</mat-label>
            <mat-select #dockerfile formControlName="dockerfile" (selectionChange)="updateContent($event.value, 'dockerfile')">
                <mat-option *ngFor="let item of resources.dockerfile; let i = index" [value]="item.name">
                    {{item.name}}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <button mat-icon-button (click)="showResourceContent(dockerfile.value, 'dockerfile')" matTooltip="Preview Dockerfile">
            <mat-icon>remove_red_eye</mat-icon>
        </button>
    </div>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Volume Name</mat-label>
            <input matInput formControlName="volumeName">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Volume Path</mat-label>
            <input matInput formControlName="volumePath">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Producer</mat-label>
            <input matInput formControlName="producer">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Data Input</mat-label>
            <textarea matInput formControlName="dataInput"></textarea>
        </mat-form-field>
        </div>
</div>


<div class="code-window" *ngIf="showResourceContentBoolean">
    <div class="code">
        <span class="close" (click)="showResourceContentBoolean = false">&times;</span>
        <div>
            <pre><code [highlight]="resourceContent" [lineNumbers]="true" [languages]="languages"></code></pre>
        </div>
    </div>
</div>
