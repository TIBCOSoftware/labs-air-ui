<mat-card fxFlex style="height: 100%; box-shadow:none;" [formGroup]="pipelineForm">
    <mat-tab-group>
        <mat-tab label="General Configuration">
            <mat-card-content>     
                <div fxLayout="column" fxLayoutAlign="center start" style="height: 100%;">
                    <mat-form-field fxFlex="1 1 15%" appearance="outline">
                        <mat-label>Name</mat-label>
                        <input matInput formControlName="name" required>
                    </mat-form-field>
                    <mat-form-field fxFlex="1 1 15%" appearance="outline">
                        <mat-label>Type</mat-label>
                        <mat-select formControlName="pipelineType">
                            <mat-option *ngFor="let item of pipelineTypes;" [value]="item.value">
                                {{item.viewValue}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-form-field fxFlex="1 1 15%" appearance="outline">
                        <mat-label>Deployer Type</mat-label>
                        <mat-select formControlName="deployerType">
                            <mat-option *ngFor="let item of deployerTypes;" [value]="item.value">
                                {{item.viewValue}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-form-field fxFlex="1 1 15%" appearance="outline">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description"></textarea>
                    </mat-form-field>
                    <mat-form-field fxFlex="1 1 15%" appearance="outline">
                        <mat-label>Log Level</mat-label>
                        <mat-select formControlName="logLevel">
                            <mat-option *ngFor="let item of logLevels;" [value]="item.value">
                                {{item.viewValue}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </mat-card-content>
        </mat-tab>
        <mat-tab label="Artifact Selection">
            <mat-form-field appearance="outline">
                <mat-label>Requirement</mat-label>
                <mat-select formControlName="requirement">
                    <mat-option *ngFor="let requirement of requirements;" [value]="requirement.name">
                        {{requirement.name}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Configuration</mat-label>
                <mat-select formControlName="configurationFile">
                    <mat-option *ngFor="let file of files;" [value]="file.name">
                        {{file.name}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </mat-tab>
      </mat-tab-group>
</mat-card>
