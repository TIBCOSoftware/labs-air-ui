<div [formGroup]="formData" >
    <h4>REST Headers</h4>
    <div class="space" formArray="headersArray">
        <div formArray="headers">
            <div *ngFor="let header of headerFormGroup; let i = index">
                <div [formGroup]="header">
                    <mat-form-field appearance="outline">
                        <mat-label>Key</mat-label>
                        <input readonly matInput formControlName="key">
                    </mat-form-field>
                    <mat-form-field appearance="outline">
                        <mat-label>Value</mat-label>
                        <input readonly matInput formControlName="value">
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>
</div>
