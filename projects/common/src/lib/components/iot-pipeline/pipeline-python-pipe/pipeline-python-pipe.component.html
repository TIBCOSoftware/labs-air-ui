<div [formGroup]="pythonPipeForm" class="python-pipe">
    <mat-card-header>
        <mat-card-title>Python Pipe Configuration</mat-card-title>
    </mat-card-header>   
     <mat-form-field appearance="outline">
        <mat-label>Log Level</mat-label>
        <mat-select formControlName="logLevel">
            <mat-option *ngFor="let item of logLevels;" [value]="item.value">
                {{item.viewValue}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Processor</mat-label>
        <mat-select formControlName="name" (selectionChange)="updateFormOnChange($event.value)">
            <mat-option *ngFor="let item of resources; let i = index" [value]="item.name">
                {{item.name}}
            </mat-option>
        </mat-select>
    </mat-form-field>
    <div>
        <mat-form-field appearance="outline">
            <mat-label>Data Input</mat-label>
            <textarea matInput formControlName="dataInput"></textarea>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="showResourceConfiguration = true">Resource Configuration</button>
    </div>
    <div class="configuration-window" *ngIf="showResourceConfiguration">
        <div class="configuration-content" formGroupName="context">
            <span class="close" (click)="showResourceConfiguration = false">&times;</span>
            <div class="processor-gpu">
                <div class="gpu">
                    <mat-checkbox [checked]="useGPU" color="primary" (change)="checkGPU($event.checked)">
                        Use GPU
                    </mat-checkbox>
                </div>
            </div>
            <h4 class="input-heading">Input Config</h4>
            <div class="input-selection" formGroupName="data">
                <div class="input" formGroupName="input" *ngFor="let pipe of pipeInputs.controls | keyvalue; let i = index">
                    <mat-form-field appearance="outline">
                        <mat-label>Input value for {{pipe.key}}</mat-label>
                        <mat-select [formControlName]="pipe.key">
                            <mat-option *ngFor="let item of inputSelections" [value]="item">
                                {{item}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="extra-config">
                <h4 class="input-heading">Extra Configuration</h4>
                <button class="input-heading" mat-raised-button color="primary" (click)="addConfig()">Add config</button>
            </div>
            <div formGroupName="data" class="input-body">
                <div class="input" formArrayName="config" *ngFor="let config of configs.controls; let i = index">
                    <div [formGroupName]="i">
                        <mat-form-field appearance="outline">
                            <mat-label>Key</mat-label>
                            <input matInput formControlName="key">
                        </mat-form-field>
                        <mat-form-field appearance="outline">
                            <mat-label>Value</mat-label>
                            <input matInput formControlName="value">
                        </mat-form-field>
                        <mat-icon  class="click" (click)="deleteConfig(i)">delete_outline</mat-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
